<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>马年·天骏巡游</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #f9d58f;
      --gold-soft: #d3a95b;
      --ink: #0a0e19;
      --panel: rgba(10, 14, 25, 0.55);
      --line: rgba(255, 220, 150, 0.25);
      --mint: #a2ffe0;
      --danger: #ff7a7a;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', sans-serif;
      color: #f8f8f8;
      background:
        radial-gradient(circle at 18% 18%, rgba(116, 70, 255, 0.2), transparent 42%),
        radial-gradient(circle at 80% 10%, rgba(12, 190, 255, 0.18), transparent 40%),
        radial-gradient(circle at 70% 85%, rgba(244, 158, 70, 0.16), transparent 45%),
        linear-gradient(150deg, #05070f, #090d18 40%, #04050a);
      letter-spacing: 0.02em;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.12;
      background-image: radial-gradient(circle, rgba(255,255,255,0.16) 0.6px, transparent 0.8px);
      background-size: 2px 2px;
      mix-blend-mode: soft-light;
    }

    .ui {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      padding: clamp(16px, 2.5vw, 32px);
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
    }

    .card {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: inset 0 0 40px rgba(255, 214, 144, 0.05), 0 10px 50px rgba(0, 0, 0, 0.45);
    }

    .hero {
      grid-column: 1 / 2;
      padding: 22px 26px;
      max-width: 620px;
    }

    .hero .eyebrow {
      color: var(--gold-soft);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      margin-bottom: 8px;
    }

    .hero h1 {
      margin: 0;
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(1.7rem, 3vw, 3rem);
      font-weight: 900;
      line-height: 1.2;
      background: linear-gradient(180deg, #fff8d6, #f0c778 55%, #ad7c36);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(255, 208, 129, 0.35);
    }

    .hero p {
      margin: 12px 0 0;
      color: rgba(255, 255, 255, 0.82);
      font-size: 0.95rem;
      line-height: 1.8;
    }

    .status {
      grid-column: 2 / 3;
      justify-self: end;
      width: min(360px, 86vw);
      padding: 18px 18px 16px;
    }

    .label {
      font-size: 12px;
      letter-spacing: 0.22em;
      color: #cab180;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .progress {
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      border: 1px solid rgba(255, 212, 140, 0.18);
      margin-bottom: 10px;
    }

    .progress > i {
      display: block;
      width: 0%;
      height: 100%;
      transition: width 180ms linear;
      background: linear-gradient(90deg, #fdf4d8, #f4be63 70%, #cf8c35);
      box-shadow: 0 0 20px rgba(244, 190, 99, 0.7);
    }

    .status-text {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.92);
      margin-bottom: 12px;
    }

    .tokens {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .token {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 221, 154, 0.3);
      color: rgba(255, 236, 200, 0.85);
      background: rgba(255, 206, 122, 0.08);
      transition: all 220ms ease;
    }

    .token.active {
      color: #1a1200;
      border-color: rgba(255, 230, 170, 0.95);
      background: linear-gradient(120deg, #fff0c9, #f0ba64);
      box-shadow: 0 0 26px rgba(243, 184, 92, 0.55);
      transform: translateY(-1px);
    }

    .controls {
      grid-column: 1 / -1;
      align-self: end;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 14px;
      pointer-events: none;
    }

    .hint {
      max-width: min(680px, 100%);
      padding: 14px 18px;
    }

    .hint b {
      color: var(--gold);
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    button {
      border: 1px solid rgba(255, 219, 155, 0.35);
      background: linear-gradient(180deg, rgba(255, 218, 156, 0.18), rgba(255, 160, 70, 0.08));
      color: #fdf6e4;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 234, 190, 0.85);
      box-shadow: 0 10px 28px rgba(250, 186, 96, 0.22);
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 30%, rgba(19, 22, 46, 0.72), rgba(3, 3, 8, 0.92));
      transition: opacity 450ms ease;
      padding: 20px;
    }

    .modal {
      width: min(740px, 95vw);
      border-radius: 24px;
      border: 1px solid rgba(255, 222, 156, 0.35);
      background:
        linear-gradient(180deg, rgba(255, 237, 195, 0.06), transparent 60%),
        rgba(7, 10, 20, 0.82);
      box-shadow: 0 20px 80px rgba(0,0,0,0.6), inset 0 0 30px rgba(255, 196, 104, 0.1);
      padding: clamp(20px, 4vw, 34px);
    }

    .modal h2 {
      margin: 0;
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      line-height: 1.25;
    }

    .modal p {
      color: rgba(255,255,255,0.85);
      line-height: 1.9;
      margin: 10px 0 0;
    }

    .modal .cta {
      margin-top: 22px;
      font-size: 15px;
      padding: 11px 22px;
    }

    .hidden { opacity: 0; pointer-events: none !important; }

    @media (max-width: 900px) {
      .ui { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
      .status { grid-column: 1 / 2; justify-self: stretch; width: 100%; }
      .controls { flex-direction: column; align-items: stretch; }
      .actions { justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="grain"></div>

  <div class="ui">
    <section class="hero card">
      <div class="eyebrow">2026 · YEAR OF THE HORSE</div>
      <h1>马年「天骏巡游」交互祈愿局</h1>
      <p>
        按住屏幕蓄力、拖动绘制星轨、松开触发“天骏奔腾”。累计三枚灵印，解锁马年祝愿。
        这是一场偏仪式感与视觉沉浸的互动玩法，适合大屏展示与节日活动页。
      </p>
    </section>

    <aside class="status card">
      <div class="label">RITUAL PROGRESS</div>
      <div class="progress"><i id="chargeBar"></i></div>
      <div class="status-text" id="statusText">等待启动仪式</div>
      <div class="tokens">
        <span class="token" id="token0">赤焰灵印</span>
        <span class="token" id="token1">鎏金灵印</span>
        <span class="token" id="token2">星穹灵印</span>
      </div>
    </aside>

    <div class="controls">
      <div class="hint card" id="hintBox">
        <b>玩法：</b>长按 1 秒以上可蓄力，拖动形成尾焰。松开后若能量足够，会触发一次天骏冲刺并点亮灵印。
      </div>
      <div class="actions">
        <button id="clearBtn">清空星轨</button>
        <button id="restartBtn">重新巡游</button>
      </div>
    </div>
  </div>

  <div id="overlay">
    <div class="modal">
      <h2>马年限定互动 · 天骏巡游</h2>
      <p>
        手势建议：<b>按住蓄力 → 拖动绘制 → 松开冲刺</b>。每次完美冲刺都会召唤一匹“流光马影”，
        三匹汇聚即完成“马到成功”祝愿。
      </p>
      <button class="cta" id="startBtn">开启巡游</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const chargeBar = document.getElementById('chargeBar');
    const statusText = document.getElementById('statusText');
    const hintBox = document.getElementById('hintBox');

    const state = {
      pointerDown: false,
      pointer: { x: 0, y: 0 },
      charge: 0,
      maxCharge: 100,
      energyGain: 0.92,
      trails: [],
      stars: [],
      sparks: [],
      horses: [],
      seals: [false, false, false],
      phase: 0,
      running: false,
      lastTs: performance.now(),
      blessings: ['马到功成', '一马当先', '龙马精神']
    };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createStars(140);
    }

    function createStars(count = 120) {
      state.stars.length = 0;
      for (let i = 0; i < count; i++) {
        state.stars.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 1.6 + 0.3,
          tw: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.02 + 0.01
        });
      }
    }

    function pointerPos(event) {
      const p = event.touches ? event.touches[0] : event;
      state.pointer.x = p.clientX;
      state.pointer.y = p.clientY;
    }

    function onPressStart(event) {
      if (!state.running) return;
      pointerPos(event);
      state.pointerDown = true;
      state.charge = Math.max(8, state.charge * 0.4);
      statusText.textContent = '踏风蓄势中…保持按住';
      hintBox.innerHTML = '<b>提示：</b>蓄力越满，冲刺越华丽。建议保持 1.2 秒以上。';
    }

    function onPressMove(event) {
      if (!state.running) return;
      pointerPos(event);
      if (!state.pointerDown) return;

      state.trails.push({
        x: state.pointer.x,
        y: state.pointer.y,
        life: 1,
        size: 1.3 + state.charge / 55,
        hue: 35 + Math.random() * 18
      });

      if (state.trails.length > 320) state.trails.shift();
    }

    function onPressEnd() {
      if (!state.running) return;
      if (state.pointerDown && state.charge > 38) {
        launchHorse(state.pointer.x, state.pointer.y, state.charge);
        claimSeal();
      } else {
        statusText.textContent = '能量不足，继续蓄力';
        hintBox.innerHTML = '<b>提示：</b>再按久一点。至少达到 40% 能量可触发冲刺。';
      }
      state.pointerDown = false;
      state.charge = 0;
    }

    function launchHorse(x, y, energy) {
      const dir = -Math.PI / 3.2 - Math.random() * 0.12;
      const speed = 7 + energy * 0.08;
      state.horses.push({
        x,
        y,
        vx: Math.cos(dir) * speed,
        vy: Math.sin(dir) * speed,
        life: 1,
        energy,
        phase: Math.random() * Math.PI * 2
      });

      for (let i = 0; i < 46; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 4 + energy * 0.045;
        state.sparks.push({
          x,
          y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 1,
          hue: 32 + Math.random() * 30,
          size: Math.random() * 2 + 1.2
        });
      }

      statusText.textContent = '天骏冲刺成功 · 灵印点亮';
      hintBox.innerHTML = '<b>连击建议：</b>连续完成 3 次高能冲刺，可触发完整祝福文案。';
    }

    function claimSeal() {
      const idx = state.seals.findIndex((v) => !v);
      if (idx === -1) return;

      state.seals[idx] = true;
      document.getElementById(`token${idx}`).classList.add('active');

      if (state.seals.every(Boolean)) {
        statusText.textContent = '✨ 三印齐聚：马到成功';
        hintBox.innerHTML = `<b>完成：</b>${state.blessings.join(' · ')}。可点击“重新巡游”再次体验。`;
      }
    }

    function drawStars() {
      for (const s of state.stars) {
        s.tw += s.speed;
        const alpha = 0.2 + (Math.sin(s.tw) + 1) * 0.35;
        ctx.fillStyle = `rgba(197, 228, 255, ${alpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawTrails(dt) {
      for (let i = state.trails.length - 1; i >= 0; i--) {
        const t = state.trails[i];
        t.life -= 0.016 * dt;
        if (t.life <= 0) {
          state.trails.splice(i, 1);
          continue;
        }
        const a = Math.max(0, t.life * 0.6);
        ctx.fillStyle = `hsla(${t.hue}, 100%, 68%, ${a})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.size + (1 - t.life) * 3.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawSparks(dt) {
      for (let i = state.sparks.length - 1; i >= 0; i--) {
        const p = state.sparks[i];
        p.life -= 0.02 * dt;
        if (p.life <= 0) {
          state.sparks.splice(i, 1);
          continue;
        }
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.98;
        p.vy = p.vy * 0.985 + 0.02;

        ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${p.life})`;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    }

    function drawHorseGlyph(h) {
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(Math.atan2(h.vy, h.vx));
      const scale = 0.7 + h.energy / 120;
      ctx.scale(scale, scale);

      const glow = 0.2 + h.life * 0.8;
      ctx.strokeStyle = `rgba(255, 219, 146, ${glow})`;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(-22, 2);
      ctx.quadraticCurveTo(-8, -12, 9, -8);
      ctx.quadraticCurveTo(20, -5, 16, 5);
      ctx.quadraticCurveTo(12, 8, 6, 12);
      ctx.moveTo(-2, 10);
      ctx.lineTo(0, 25);
      ctx.moveTo(10, 7);
      ctx.lineTo(12, 24);
      ctx.moveTo(-15, -1);
      ctx.quadraticCurveTo(-20, -12, -25, -9);
      ctx.stroke();

      ctx.fillStyle = `rgba(255, 184, 95, ${0.16 + h.life * 0.3})`;
      ctx.fillRect(-20, -15, 45, 28);
      ctx.restore();
    }

    function updateHorses(dt) {
      for (let i = state.horses.length - 1; i >= 0; i--) {
        const h = state.horses[i];
        h.life -= 0.01 * dt;
        if (h.life <= 0 || h.x > window.innerWidth + 60 || h.y < -80) {
          state.horses.splice(i, 1);
          continue;
        }
        h.phase += 0.16;
        h.x += h.vx;
        h.y += h.vy + Math.sin(h.phase) * 0.65;
        h.vx *= 0.998;
        h.vy *= 0.997;

        drawHorseGlyph(h);
      }
    }

    function drawBlessingText() {
      if (!state.seals.every(Boolean)) return;
      const t = performance.now() * 0.0012;
      const y = window.innerHeight * 0.26 + Math.sin(t) * 6;

      ctx.save();
      ctx.font = `700 ${Math.min(window.innerWidth * 0.07, 78)}px 'Noto Serif SC', serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const gradient = ctx.createLinearGradient(0, y - 40, 0, y + 40);
      gradient.addColorStop(0, '#fff6dc');
      gradient.addColorStop(0.56, '#efc16d');
      gradient.addColorStop(1, '#a26a2c');
      ctx.fillStyle = gradient;
      ctx.shadowColor = 'rgba(249, 197, 118, 0.45)';
      ctx.shadowBlur = 26;
      ctx.fillText('马 到 成 功', window.innerWidth / 2, y);
      ctx.restore();
    }

    function animate(ts) {
      const dt = Math.min((ts - state.lastTs) / 16.666, 2.2);
      state.lastTs = ts;

      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      drawStars();

      if (state.pointerDown) {
        state.charge = Math.min(state.maxCharge, state.charge + state.energyGain * dt * 2.2);
      }
      chargeBar.style.width = `${(state.charge / state.maxCharge) * 100}%`;

      drawTrails(dt);
      drawSparks(dt);
      updateHorses(dt);
      drawBlessingText();

      requestAnimationFrame(animate);
    }

    function resetAll() {
      state.charge = 0;
      state.trails.length = 0;
      state.sparks.length = 0;
      state.horses.length = 0;
      state.seals = [false, false, false];
      for (let i = 0; i < 3; i++) {
        document.getElementById(`token${i}`).classList.remove('active');
      }
      statusText.textContent = '已重置，等待下一次巡游';
      hintBox.innerHTML = '<b>玩法：</b>长按 1 秒以上可蓄力，拖动形成尾焰。松开后若能量足够，会触发一次天骏冲刺并点亮灵印。';
    }

    window.addEventListener('resize', resize);
    window.addEventListener('pointerdown', onPressStart);
    window.addEventListener('pointermove', onPressMove);
    window.addEventListener('pointerup', onPressEnd);
    window.addEventListener('pointercancel', onPressEnd);

    document.getElementById('clearBtn').addEventListener('click', () => {
      state.trails.length = 0;
      state.sparks.length = 0;
      statusText.textContent = '星轨已清空';
    });

    document.getElementById('restartBtn').addEventListener('click', resetAll);

    document.getElementById('startBtn').addEventListener('click', () => {
      state.running = true;
      const overlay = document.getElementById('overlay');
      overlay.classList.add('hidden');
      setTimeout(() => overlay.style.display = 'none', 500);
      statusText.textContent = '仪式开始：按住任意位置蓄力';
    });

    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
